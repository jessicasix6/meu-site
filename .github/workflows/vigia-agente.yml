# Vigia da rotina do agente.
#
# O agente não consegue avisar que morreu — quem está morto não manda recado.
# Então quem avisa é este workflow, que roda por fora e cobra presença: se o
# diário não recebe comentário há mais de 90 minutos, ele marca a Jéssica numa
# issue, e a marcação vira e-mail do GitHub.
#
# Esse é exatamente o problema de setembro de 2026, quando a rotina passou horas
# falhando em silêncio e aparecendo como sucesso.
name: vigia-agente

on:
  schedule:
    # A cada 30 minutos. O agendador do GitHub atrasa sob carga, o que é
    # aceitável para um limite de 90 minutos.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      forcar_alerta:
        description: "Manda o alerta mesmo com o diário em dia (para testar o canal)"
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  checar-diario:
    # Duas execuções simultâneas passariam as duas pela checagem do marcador
    # antes de qualquer uma comentar, gerando alerta e e-mail em dobro.
    concurrency:
      group: vigia-agente-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Cobrar presenca do agente
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DONA: ${{ github.repository_owner }}
          FORCAR: ${{ inputs.forcar_alerta }}
        run: |
          set -euo pipefail
          LIMITE_MIN=90
          MARCADOR='<!-- alerta-vigia -->'

          # O batimento é a issue #95, que o worker reescreve ao fim de TODA
          # execução — inclusive quando a fila está vazia. É o que distingue
          # "worker sem tarefa" de "worker morto", que de fora são idênticos.
          # Olha updatedAt (o corpo é reescrito), não comentário.
          BATIMENTO=95

          ESTADO=$(gh api "repos/$REPO/issues/$BATIMENTO" --jq '{updated_at, state, body}' 2>/dev/null || echo '')
          if [ -z "$ESTADO" ]; then
            echo "Nao consegui ler a issue de batimento #$BATIMENTO."
            exit 1
          fi

          CORPO=$(printf '%s' "$ESTADO" | jq -r '.body // ""')
          FECHADA=$(printf '%s' "$ESTADO" | jq -r '.state')

          # A data vem de DENTRO do corpo, não de updated_at: qualquer alteração
          # mexe no updated_at, inclusive o comentário de alerta que este vigia
          # posta — ele se auto-silenciaria depois do primeiro aviso, virando
          # justamente o tipo de falha calada que ele existe pra impedir.
          # O `|| true` é essencial: com `set -o pipefail`, grep sem resultado
          # devolve 1 e derruba o script inteiro — e "sem resultado" é
          # exatamente o caso de batimento nunca escrito, que este vigia
          # precisa detectar. Sem isso ele morria calado, virando a falha que
          # existe pra impedir. Aconteceu na primeira execução real.
          ULTIMO=$(printf '%s' "$CORPO" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} UTC' | head -1 | sed 's/ UTC//' || true)

          if [ -z "$ULTIMO" ]; then
            # Sem carimbo no corpo, o Passo 10 (batimento) ainda não foi
            # instalado no prompt do worker — é diferente de worker morto.
            echo "Batimento nunca escrito: o Passo 10 ainda nao esta no prompt do worker."
            NUNCA_BATEU=1
            ULTIMO=$(printf '%s' "$ESTADO" | jq -r '.created_at // .updated_at')
            ULTIMO=$(date -u -d "$ULTIMO" '+%Y-%m-%d %H:%M')
          fi

          if [ "$FECHADA" = "closed" ]; then
            echo "A issue de batimento foi fechada. Sem ela o vigia fica cego."
            gh issue reopen "$BATIMENTO" --repo "$REPO" || true
          fi

          AGORA=$(date -u +%s)
          VISTO=$(date -u -d "$ULTIMO UTC" +%s)
          PARADO=$(( (AGORA - VISTO) / 60 ))
          echo "Ultimo sinal do agente: $ULTIMO (ha ${PARADO} min)"

          if [ "${FORCAR:-false}" != "true" ] && [ "$PARADO" -le "$LIMITE_MIN" ]; then
            echo "Dentro do limite de ${LIMITE_MIN} min. Tudo certo."
            exit 0
          fi

          # Nao repete alerta: se o ultimo comentario ja e um alerta, o aviso ja
          # foi dado e ficar recomentando so enche a caixa de e-mail.
          JA_ALERTADO=$(printf '%s' "$CORPO" | grep -cF "$MARCADOR" || true)
          if [ "${FORCAR:-false}" != "true" ] && [ "${JA_ALERTADO:-0}" != "0" ]; then
            echo "Alerta ja registrado e ainda nao respondido. Nao vou repetir."
            exit 0
          fi

          {
            printf '%s\n' "$MARCADOR"
            if [ "${NUNCA_BATEU:-0}" = "1" ]; then
              printf '## @%s — o worker ainda não deu o primeiro sinal\n\n' "$DONA"
              printf 'O corpo desta issue nunca foi reescrito com um horário, então o\n'
              printf 'batimento (Passo 10) ainda não está funcionando.\n\n'
              printf 'Causa conhecida: o ambiente da rotina está sem os acessos que o\n'
              printf 'batimento precisa — `gh` não instalado e o repositório não conectado\n'
              printf 'à sessão (HTTP 403). Sem isso o worker não consegue escrever aqui,\n'
              printf 'mesmo rodando normalmente.\n\n'
              printf '**Para destravar:**\n'
              printf '1. Conectar o repositório `%s` à rotina, nas configurações dela\n' "$REPO"
              printf '2. Liberar `top3profissional.com.br` na política de rede da organização\n'
              printf '3. Instalar o Passo 10 no prompt do worker (o texto está no corpo desta issue)\n\n'
            else
              printf '## ⚠️ @%s — o worker parou de dar sinal\n\n' "$DONA"
              printf 'Último batimento: **%s UTC** (há **%s minutos**).\n' "$ULTIMO" "$PARADO"
              printf 'O limite combinado é de %s minutos.\n\n' "$LIMITE_MIN"
              printf 'Isso normalmente significa que a rotina agendada falhou ou foi desligada.\n\n'
              printf '**O que conferir:**\n'
              printf '1. Se a rotina agendada ainda está ativa na conta\n'
              printf '2. Se a última execução dela registrou erro\n'
              printf '3. Se o site está de pé: https://www.top3profissional.com.br/health\n\n'
            fi
            printf 'Este aviso não se repete enquanto não houver novo batimento.\n'
          } > alerta.md

          gh issue comment "$BATIMENTO" --repo "$REPO" --body-file alerta.md
          echo "Alerta publicado."
