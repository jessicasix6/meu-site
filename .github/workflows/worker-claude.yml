name: worker-claude
# Worker TOP3 rodando via GitHub Actions (tem acesso ao repo)
# Executa a cada 6 horas

on:
  schedule:
    # A cada 6 horas
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      forca_execucao:
        description: "Rodar mesmo se houver erro"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Exportar dados do VPS (Missão 6)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          sudo apt-get install -y sshpass 2>/dev/null | tail -1
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          scp_exit=0
          sshpass -p "$VPS_PASSWORD" scp -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST:/root/meu-site/dados-oportunidades.json" \
            dados-oportunidades.json 2>/tmp/scp_err || scp_exit=$?
          if [ $scp_exit -ne 0 ]; then
            err=$(cat /tmp/scp_err)
            if echo "$err" | grep -qi "No such file"; then
              echo "⚠ Arquivo ainda não existe no VPS (normal na primeira vez)"
            else
              echo "❌ Falha no SCP: $err" >&2
              exit $scp_exit
            fi
          fi
          if [ -f dados-oportunidades.json ]; then
            git config user.email "worker@top3profissional.com.br"
            git config user.name "TOP3 Worker"
            git add dados-oportunidades.json
            git diff --staged --quiet || git commit -m "dados: atualiza oportunidades $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      - name: Run TOP3 Worker
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Lê autorizações do diário #98
          echo "=== Lendo autorizações do diário #98 ==="
          gh issue view 98 --repo ${{ github.repository }} --json body --jq '.body' | grep -E 'autorizo|cancela' || echo "Nenhuma autorização encontrada"

          # Lista PRs com CI falhando
          echo "=== Checando PRs ==="
          gh pr list --repo ${{ github.repository }} --state open --json number,title,statusCheckRollup || true

          # Lista issues abertas
          echo "=== Checando issues ==="
          gh issue list --repo ${{ github.repository }} --state open --json number,title,labels --limit 10 || true

          echo "✅ Worker rodou com sucesso"

      - name: Update diário #98
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          gh issue comment 98 \
            --repo ${{ github.repository }} \
            --body "🤖 Worker executado em $TIMESTAMP (GitHub Actions)"
