name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 179.198.126.247
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/meu-site
            git fetch origin main
            git reset --hard origin/main
            npm install --omit=dev
            systemctl restart top3profissional
            sleep 3
            curl -sf http://localhost:8123/health || exit 1
