name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 179.198.126.247
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/meu-site
            PREV_COMMIT=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            npm install --omit=dev
            systemctl restart top3profissional
            sleep 3
            if curl -sf http://localhost:8123/health > /dev/null; then
              echo "Deploy OK: $(git rev-parse HEAD)"
            else
              echo "Health check falhou, revertendo pra $PREV_COMMIT"
              git reset --hard "$PREV_COMMIT"
              npm install --omit=dev
              systemctl restart top3profissional
              sleep 3
              if curl -sf http://localhost:8123/health > /dev/null; then
                echo "Rollback OK, versão anterior está no ar de novo"
              else
                echo "Rollback também falhou no health check"
              fi
              exit 1
            fi
