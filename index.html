<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>meu-site — agente de busca</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main>
    <h1>Encontre um profissional agora</h1>
    <p class="subtitle">Pergunte algo como "manicure amanhã em BH" — um agente de IA responde de verdade.</p>

    <section id="ranking" class="ranking" aria-label="Top 3 profissionais mais bem avaliados">
      <h2 class="ranking-title">Top 3 mais bem avaliados</h2>
      <ol id="ranking-list" class="ranking-list"></ol>
    </section>

    <div class="terminal">
      <div id="chat-log" class="terminal-log" aria-live="polite"></div>
      <form id="chat-form" class="terminal-input-row" autocomplete="off">
        <span class="prompt-sym" aria-hidden="true">visitante@meu-site:~$</span>
        <input
          id="chat-input"
          type="text"
          name="q"
          placeholder="digite e aperte enter..."
          aria-label="Mensagem para o agente"
          required
        />
        <button type="submit" class="sr-only">Enviar</button>
      </form>
    </div>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
