<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>meu-site — agente de busca</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main>
    <h1>Encontre um profissional agora</h1>
    <p class="subtitle">Pergunte algo como "manicure amanhã em BH" — um agente de IA responde de verdade.</p>

    <div id="chat-log" aria-live="polite"></div>

    <form id="chat-form" autocomplete="off">
      <input
        id="chat-input"
        type="text"
        name="q"
        placeholder="O que você precisa e onde?"
        aria-label="Mensagem para o agente"
        required
      />
      <button type="submit">Enviar</button>
    </form>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
